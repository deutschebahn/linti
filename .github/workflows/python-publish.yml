name: Upload Python Package

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  run-unit-test:
    uses: ./.github/workflows/unit-tests.yml
    with:
      python-version: "3.11"


  release-build:
    runs-on: ubuntu-latest
    needs:
      - run-unit-test

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # Guards against a release whose tag does not describe the code being
      # built -- e.g. a release published for a tag that does not exist yet,
      # which GitHub silently creates on the target branch head.
      - name: Verify tag matches package version
        run: |
          tag="${{ github.event.release.tag_name }}"
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$tag" != "v$version" ]; then
            echo "::error::Release tag '$tag' does not match pyproject.toml version '$version' (expected tag 'v$version')"
            exit 1
          fi
          echo "Release tag '$tag' matches package version '$version'."

      - name: Build release distributions
        run: |
          python -m pip install build
          python -m build

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: release-dists
          path: dist/

  pypi-publish:
    runs-on: ubuntu-latest
    needs:
      - release-build
    permissions:
      # IMPORTANT: this permission is mandatory for trusted publishing
      id-token: write

    # Dedicated environments with protections for publishing are strongly recommended.
    # For more information, see: https://docs.github.com/en/actions/deployment/targeting-different-environments/using-environments-for-deployment#deployment-protection-rules
    environment:
      name: pypi
      url: https://pypi.org/p/linti

    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist/

      - name: Publish release distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
