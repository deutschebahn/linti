!TM1py.ProcessObject
Name: Test_Parameter_Variable_Rules
PrologProcedure: |-
  # Test parameter and variable rules
  
  # Valid: Reading from parameter
  cLogOutput = pLogOutput;
  
  # Invalid: Assigning to parameter (S210)
  pLogOutput = 0;
  
  # Valid: Reading from variable
  sDim = vDimension;
  
  # Invalid: Assigning to variable (S210)
  vDimension = 'NewDim';
  
  # Valid: Assigning to local variable
  nValue = 5;
