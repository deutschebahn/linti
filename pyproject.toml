[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "linti"
version = "0.7.0"
description = "A linter for TM1 TI scripts"
authors = [
    { name = "Florian Scherzberg", email = "florian.scherzberg@deutschebahn.com" }
]
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "typer[all]>=0.9.0",
    "pyyaml>=6.0",
    "pydantic>=2.0.0",
    "pathspec>=0.12.0"
]

[project.optional-dependencies]
# Linting processes straight off a TM1 server. Kept optional because neither
# dependency is needed to lint files on disk, and TM1py pulls in requests.
tm1 = [
    "TM1py>=2.0",
    "keyring>=24.0"
]
dev = [
    "pytest",
    "pre-commit",
    # Installed so the real import paths are exercised; the test suite itself
    # never needs a server and never needs these to be importable.
    "TM1py>=2.0",
    "keyring>=24.0"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["linti*"]

[project.scripts]
linti = "linti.cli.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
filterwarnings = [
    # We intentionally use pathspec's "gitwildmatch" factory: it is the only
    # name whose behaviour is identical across pathspec 0.12.x and 1.x (the
    # "gitignore" name maps to a *different* matcher depending on the major).
    "ignore:GitWildMatchPattern .'gitwildmatch'. is deprecated:DeprecationWarning",
]
